ext><circle class="glow" style="animation-delay:3.00s" cx="1050" cy="140" r="22" fill="#F6A548"/><circle cx="1050" cy="140" r="22" fill="#F6A548"/><text x="1050" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1D1D1B" text-anchor="middle">9</text><text x="1050" y="190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66" text-anchor="middle">PrestaShop 9</text>
