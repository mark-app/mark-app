<style>.runner { animation: run 4s ease-in-out infinite; }@keyframes run { 0% { transform: translateX(0); } 75%, 100% { transform: translateX(900px); } }.glow { opacity: 0; transform-box: fill-box; transform-origin: center; animation: glow 4s ease-out infinite; }@keyframes glow { 0% { opacity: .45; transform: scale(1); } 25%, 100% { opacity: 0; transform: scale(1.8); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
