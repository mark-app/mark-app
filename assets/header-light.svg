<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="MARK-APP, experts in PrestaShop">
<title>MARK-APP, experts in PrestaShop</title>
<style>.ln { opacity: 0; animation: show .5s ease forwards; }@keyframes show { to { opacity: 1; } }.cursor { animation: blink 1s steps(1) infinite; }@keyframes blink { 50% { opacity: 0; } }.pulse { transform-origin: 150px 190px; animation: pulse 3.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: .0; transform: scale(1); } 50% { opacity: .35; transform: scale(1.18); } }.rise { opacity: 0; animation: rise .8s ease forwards; }@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#E9E7E0"/></pattern></defs><rect width="1200" height="380" rx="18" fill="#FAFAF7"/><rect width="1200" height="380" rx="18" fill="url(#grid)"/><circle class="pulse" cx="150" cy="190" r="96" fill="#F6A548"/><circle cx="150.0" cy="190.0" r="80.0" fill="#F6A548"/><polygon points="83.9,222.7 109.7,151.6 124.0,151.6 149.9,222.7 137.4,222.7 116.9,164.5 96.1,222.7" fill="#FFFFFF"/><polygon points="149.9,222.7 175.7,151.6 190.1,151.6 215.9,222.7 203.4,222.7 182.9,164.5 162.1,222.7" fill="#FFFFFF"/><g class="rise"><text x="270" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="#1D1D1B">M<tspan fill="#F6A548">&#923;</tspan>RK-<tspan fill="#F6A548">&#923;</tspan>PP</text></g><text class="rise" style="animation-delay:.2s" x="273" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="6.5" fill="#6B6B66">EXPERTS IN PRESTASHOP</text><rect class="rise" style="animation-delay:.35s" x="273" y="240" width="56" height="5" rx="2.5" fill="#F6A548"/><text class="rise" style="animation-delay:.45s" x="273" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1D1D1B">Support &#183; Custom modules &#183; Webshops &#183; Upgrades &#183; SEO</text><text class="rise" style="animation-delay:.55s" x="273" y="308" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6B6B66">Since 2005 &#183; Beverwijk, the Netherlands</text><rect x="718" y="140" width="456" height="190" rx="12" fill="#1D1D1B"/><circle cx="740" cy="162" r="5.5" fill="#FF5F57"/><circle cx="758" cy="162" r="5.5" fill="#FEBC2E"/><circle cx="776" cy="162" r="5.5" fill="#F6A548"/><text x="946" y="166" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#77776F" text-anchor="middle">~/mark-app</text><text class="ln" style="animation-delay:0.6s" x="740" y="205" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#F4F4F2">$ bin/console prestashop:module install macustombanner</text><text class="ln" style="animation-delay:1.5s" x="740" y="231" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#F6A548">&#10004; Install action on module macustombanner succeeded.</text><text class="ln" style="animation-delay:2.4s" x="740" y="257" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#F4F4F2">$ ./upgrade --from 1.6 --to 9.0 --zero-downtime</text><text class="ln" style="animation-delay:3.3s" x="740" y="283" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#F6A548">&#10004; Shop upgraded. SEO intact. Customers happy.</text><rect class="cursor" x="740" y="298" width="8" height="15" fill="#F6A548"/>
